<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <defs>
        <!-- 蓝底渐变 -->
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1e3a8a" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
    </defs>

    <!-- 整体圆角背景底板 -->
    <rect width="100" height="100" rx="24" fill="url(#bg)" />

    <!-- ====== 桌面显示器图形 ====== -->
    <!-- 显示器主屏幕框 -->
    <rect x="12" y="20" width="76" height="48" rx="6" stroke="#ffffff" stroke-width="4" fill="rgba(255, 255, 255, 0.15)" />
    
    <!-- 显示器支架 -->
    <path d="M 42 68 L 42 80 M 58 68 L 58 80" stroke="#ffffff" stroke-width="4" />
    <!-- 显示器底座 -->
    <path d="M 28 80 L 72 80" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

    <!-- ====== 核心文字 ====== -->
    <text 
      x="50" y="52" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
      font-weight="900" 
      font-size="24" 
      fill="#ffffff" 
      text-anchor="middle" 
      letter-spacing="2"
    >LCXL</text>

    <!-- ====== 鼠标指针 (代表远程控制) ====== -->
    <path 
      d="M 68 50 L 68 68 L 73 63 L 77 71 L 80 69.5 L 76 61 L 82 61 Z" 
      fill="#93c5fd" 
      stroke="#ffffff" 
      stroke-width="2" 
      stroke-linejoin="round" 
    />
</svg>
