[package]
name = "lcxl-remote-desk-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
lcxl-remote-desk-server = { workspace = true }
desk-signal-facade = { workspace = true }
desk-utils = { workspace = true }
desk-input-injection = { workspace = true }

clap = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
rust-i18n = { workspace = true }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

actix-rt = { workspace = true }
awc = { workspace = true }
futures-util = { workspace = true }

uuid = { workspace = true, features = ["v4"] }
ureq = { workspace = true }
config = { workspace = true }
url = { workspace = true }
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { workspace = true }
raw-window-handle = { workspace = true }
evdev = { workspace = true }
# Enable WebRTC (RTCPeerConnection) in the WebKitGTK webview, which gates it off
# by default. Matches the webkit2gtk version wry already resolves; v2_38 exposes
# `set_enable_webrtc`.
webkit2gtk = { version = "2.0", features = ["v2_38"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.23", features = ["highsierra"] }
core-foundation = "0.9"

[build-dependencies]
tauri-build = { version = "2", features = [] }
