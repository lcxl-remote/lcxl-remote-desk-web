[package]
name = "lcxl-remote-desk-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lcxl-remote-desk-server = { workspace = true }
desk-signal-facade = { workspace = true }
desk-utils = { workspace = true }
desk-input-injection = { workspace = true }

clap = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
rust-i18n = { workspace = true }

# `macos-private-api` gates the transparent-window builder method on macOS; the
# whiteboard overlay needs it. It is inert on other platforms but must match the
# `app.macOSPrivateApi` flag in tauri.conf.json.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

actix-rt = { workspace = true }
awc = { workspace = true }
futures-util = { workspace = true }

uuid = { workspace = true, features = ["v4"] }
ureq = { workspace = true }
config = { workspace = true }
url = { workspace = true }
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }
desk-virtual-display = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { workspace = true }
raw-window-handle = { workspace = true }
evdev = { workspace = true }
# Enable WebRTC (RTCPeerConnection) in the WebKitGTK webview, which gates it off
# by default. Matches the webkit2gtk version wry already resolves; v2_38 exposes
# `set_enable_webrtc`.
webkit2gtk = { version = "2.0", features = ["v2_38"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.23", features = ["highsierra"] }
core-foundation = "0.9"
# Raw `msg_send!` against the `*mut AnyObject` Tauri hands back from
# `ns_window()`. Deliberately no `objc2-app-kit`: that crate tracks objc2 0.6,
# which tao/wry already pull in, so adding it would put two incompatible
# `NSWindow` types in the same dependency tree.
objc2 = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }
