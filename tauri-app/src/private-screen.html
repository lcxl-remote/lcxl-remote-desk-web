<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
            cursor: none;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 60px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            max-width: 600px;
        }

        .lock-icon {
            font-size: 64px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fff;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #b0b0b0;
        }

        .hotkey {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            font-family: monospace;
            font-size: 16px;
            color: #fff;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="lock-icon">🔒</div>
        <h1 id="title"></h1>
        <p id="description"></p>
        <div class="hotkey">Ctrl + Alt + L</div>
        <p id="hotkey-hint" style="margin-top: 12px; font-size: 14px; color: #888;"></p>
    </div>

    <script>
        const i18n = {
            'en': {
                title: 'Remote Desktop Privacy Mode',
                description: 'This screen is being remotely controlled.\nLocal input has been blocked.',
                hotkeyHint: 'Press the above hotkey to exit privacy mode'
            },
            'zh': {
                title: '远程桌面隐私模式',
                description: '此屏幕正在被远程控制。\n本地输入已被拦截。',
                hotkeyHint: '按上方快捷键退出隐私模式'
            }
        };

        function getLocale() {
            const lang = navigator.language || navigator.userLanguage || 'en';
            if (lang.startsWith('zh')) return 'zh';
            return 'en';
        }

        const locale = getLocale();
        const texts = i18n[locale] || i18n['en'];

        document.documentElement.lang = locale === 'zh' ? 'zh-CN' : 'en';
        document.getElementById('title').textContent = texts.title;
        document.getElementById('description').innerHTML = texts.description.replace(/\n/g, '<br>');
        document.getElementById('hotkey-hint').textContent = texts.hotkeyHint;
    </script>
</body>

</html>
