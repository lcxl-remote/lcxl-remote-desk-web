name: Release

on:
  push:
    tags:
      - 'v*'
  # Allow manual dry-runs from the Actions tab (builds artifacts, skips the
  # GitHub Release creation step which is guarded on a tag ref).
  workflow_dispatch:

# Least-privilege default: build jobs only read. The docker job grants itself
# packages: write and the release job grants itself contents: write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.90.0"

jobs:
  # ---------------------------------------------------------------------------
  # Build the React frontend once and share it with the desktop packages so the
  # bundled server ships with its static assets (it reads ./static at runtime).
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vite-project/package-lock.json
      - name: Build Frontend
        working-directory: vite-project
        run: |
          npm ci
          npm run build
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: vite-project/dist

  # ---------------------------------------------------------------------------
  # Build the Tauri desktop shell as a portable zip. The shell spawns the
  # lcxl-remote-desk-server sidecar from its own directory (find_server_binary)
  # and that server serves the frontend from a sibling static/ dir, so the zip
  # ships all three flat in one directory:
  #   lcxl-remote-desk-tauri[.exe] + lcxl-remote-desk-server[.exe] + static/
  # macOS gets the same three files inside a hand-assembled .app in a drag-to-
  # Applications .dmg. Either way the icon is embedded at build time by
  # tauri-build, so no cargo tauri build / bundling toolchain is needed.
  # These are the only release assets: the standalone server packages are no
  # longer published, and the signaling image is built separately by `docker`.
  # ---------------------------------------------------------------------------
  tauri:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows
            arch: x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # The macOS entry needs a runner image that ships Xcode 26 (see the
          # "Select macOS SDK" step); macos-14 tops out at Xcode 16.2.
          - platform: macos
            arch: aarch64
            os: macos-15
            target: aarch64-apple-darwin
          # macOS x86_64 is temporarily disabled; no package is published for
          # that target until this entry is restored.
          # - platform: macos
          #   arch: x86_64
          #   os: macos-15-intel
          #   target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp Version
        uses: ./.github/actions/stamp-version

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: server/static

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # Tauri 2 GUI deps (note: webkit2gtk-4.1, not 4.0) + the capture/input
          # native deps pulled in transitively via lcxl-remote-desk-server.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf libayatana-appindicator3-dev build-essential pkg-config \
            libpipewire-0.3-dev libclang-dev libasound2-dev libssl-dev libvpx-dev \
            libx264-dev cmake nasm libx11-dev libxcb1-dev libxcb-randr0-dev libxext-dev

      - name: Install macOS Dependencies
        if: matrix.platform == 'macos'
        run: brew install libvpx x264 nasm pkg-config

      # screencapturekit pulls in apple-metal, whose Swift bridge touches
      # MTLSamplerDescriptor.reductionMode / .lodBias. Those calls sit behind an
      # `if #available(macOS 26.0, *)` guard, but compiling them still requires
      # the macOS 26 SDK. Runner images default to Xcode 16.x (macOS 15 SDK), so
      # switch to the newest installed Xcode 26 before anything invokes swiftc.
      - name: Select macOS SDK
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          xcode_app=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$xcode_app" ]; then
            echo "::error::No Xcode 26 on this runner image; apple-metal needs the macOS 26 SDK."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          developer_dir="$xcode_app/Contents/Developer"
          sudo xcode-select -s "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          # Keep the runtime floor at the documented minimum even though the
          # build now uses a much newer SDK.
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
          xcodebuild -version
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: tauri-${{ matrix.target }}

      - name: Build Tauri Shell + Server
        # Single line: Windows runners default to PowerShell, which does not
        # understand bash `\` line continuations.
        run: cargo build --release --target ${{ matrix.target }} --bin lcxl-remote-desk-tauri --bin lcxl-remote-desk-server

      - name: Import macOS Developer ID certificate
        if: matrix.platform == 'macos' && startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_P12_BASE64:?missing APPLE_CERTIFICATE_P12_BASE64}"
          : "${APPLE_CERTIFICATE_PASSWORD:?missing APPLE_CERTIFICATE_PASSWORD}"
          : "${APPLE_SIGNING_IDENTITY:?missing APPLE_SIGNING_IDENTITY}"
          : "${MACOS_KEYCHAIN_PASSWORD:?missing MACOS_KEYCHAIN_PASSWORD}"
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/lcxl-release.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | openssl base64 -d -A -out "$certificate"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
          echo "MACOS_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Assemble Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/lcxl-remote-desk-tauri" release/
          cp "target/${{ matrix.target }}/release/lcxl-remote-desk-server" release/
          cp -r server/static release/static
          (cd release && zip -r "../tauri-${{ matrix.platform }}-${{ matrix.arch }}.zip" .)

      - name: Assemble Package (macOS .dmg)
        if: matrix.platform == 'macos'
        run: |
          # Derive the version from the git tag (v0.2.0 -> 0.2.0) so the .app
          # metadata matches the Release/Docker version; fall back for manual
          # (non-tag) runs.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          APP="dist/LCXL Remote Desktop.app"
          # Shell, sidecar and static all sit under Contents/MacOS so that the
          # shell's find_server_binary() (looks next to its own exe) and the
          # server's static lookup (looks next to its own exe) both resolve.
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/lcxl-remote-desk-tauri" "$APP/Contents/MacOS/"
          cp "target/${{ matrix.target }}/release/lcxl-remote-desk-server" "$APP/Contents/MacOS/"
          cp -R server/static "$APP/Contents/MacOS/static"
          cp tauri-app/src-tauri/icons/icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>LCXL Remote Desktop</string>
            <key>CFBundleDisplayName</key><string>LCXL Remote Desktop</string>
            <key>CFBundleIdentifier</key><string>com.lcxl.remote-desk</string>
            <key>CFBundleExecutable</key><string>lcxl-remote-desk-tauri</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>__VERSION__</string>
            <key>CFBundleShortVersionString</key><string>__VERSION__</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSScreenCaptureUsageDescription</key><string>Screen capture for remote desktop sessions.</string>
            <key>NSMicrophoneUsageDescription</key><string>Audio capture for remote desktop sessions.</string>
            <key>NSCameraUsageDescription</key><string>Camera access for remote desktop sessions.</string>
            <key>NSAppleEventsUsageDescription</key><string>Control Pages, Numbers, and Keynote only after you approve a Device Assistant action.</string>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/__VERSION__/${VERSION}/g" "$APP/Contents/Info.plist"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Sign nested executables first. The server sidecar originates the
            # Apple Events, so it and the responsible app identity both carry
            # the frozen Automation entitlement under hardened runtime.
            for executable in \
              "$APP/Contents/MacOS/lcxl-remote-desk-server" \
              "$APP/Contents/MacOS/lcxl-remote-desk-tauri"; do
              codesign --force --timestamp --options runtime \
                --entitlements tauri-app/src-tauri/Entitlements.plist \
                --keychain "$MACOS_SIGNING_KEYCHAIN" \
                --sign "$MACOS_SIGNING_IDENTITY" "$executable"
            done
            codesign --force --timestamp --options runtime \
              --entitlements tauri-app/src-tauri/Entitlements.plist \
              --keychain "$MACOS_SIGNING_KEYCHAIN" \
              --sign "$MACOS_SIGNING_IDENTITY" "$APP"
          else
            # workflow_dispatch is a non-releasable packaging dry-run. Apple
            # Silicon still requires an ad-hoc signature to launch the bundle.
            for executable in \
              "$APP/Contents/MacOS/lcxl-remote-desk-server" \
              "$APP/Contents/MacOS/lcxl-remote-desk-tauri"; do
              codesign --force --options runtime \
                --entitlements tauri-app/src-tauri/Entitlements.plist \
                --sign - "$executable"
            done
            codesign --force --options runtime \
              --entitlements tauri-app/src-tauri/Entitlements.plist \
              --sign - "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c 'Print :NSAppleEventsUsageDescription' "$APP/Contents/Info.plist"
          codesign -d --entitlements :- "$APP/Contents/MacOS/lcxl-remote-desk-server" 2>&1 \
            | grep -F 'com.apple.security.automation.apple-events'
          # Lay out a drag-to-Applications disk image and compress it.
          mkdir -p dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "LCXL Remote Desktop" -srcfolder dmg -ov -format UDZO \
            "tauri-${{ matrix.platform }}-${{ matrix.arch }}.dmg"

      - name: Notarize and staple macOS release
        if: matrix.platform == 'macos' && startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?missing APPLE_ID}"
          : "${APPLE_APP_PASSWORD:?missing APPLE_APP_PASSWORD}"
          : "${APPLE_TEAM_ID:?missing APPLE_TEAM_ID}"
          artifact="tauri-macos-${{ matrix.arch }}.dmg"
          codesign --force --timestamp --keychain "$MACOS_SIGNING_KEYCHAIN" \
            --sign "$MACOS_SIGNING_IDENTITY" "$artifact"
          xcrun notarytool submit "$artifact" --wait \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$artifact"
          xcrun stapler validate "$artifact"
          spctl --assess --type install --verbose=2 "$artifact"

      - name: Remove temporary macOS signing keychain
        if: always() && matrix.platform == 'macos' && startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true
          fi

      - name: Assemble Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\lcxl-remote-desk-tauri.exe" -Destination release\
          Copy-Item "target\${{ matrix.target }}\release\lcxl-remote-desk-server.exe" -Destination release\
          Copy-Item -Recurse "server\static" -Destination release\static
          Compress-Archive -Path release\* -DestinationPath "tauri-${{ matrix.platform }}-${{ matrix.arch }}.zip"

      - name: Upload Tauri Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            tauri-*.zip
            tauri-*.dmg

  # ---------------------------------------------------------------------------
  # Build the signaling server Docker image and push it to GHCR. The Dockerfile
  # builds the frontend itself, so this job does not need the frontend artifact.
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Stamp Version
        uses: ./.github/actions/stamp-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Collect the tauri packages and publish them as a GitHub Release. Runs only
  # for tag pushes; workflow_dispatch runs stop after the build jobs.
  # ---------------------------------------------------------------------------
  release:
    needs: [tauri, docker]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the GitHub Release
    steps:
      # Only the packaged artifacts — never the internal frontend-dist, which
      # is a build input consumed by other jobs, not a release asset.
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'tauri-*'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*
