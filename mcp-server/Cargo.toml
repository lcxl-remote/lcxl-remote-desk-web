[package]
name = "desk-mcp-server"
description = "Single-machine read-only MCP server exposing the diagnose agent's read capabilities"
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
desk-agent-protocol = { workspace = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1"
log = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
