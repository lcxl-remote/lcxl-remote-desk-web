[package]
name = "desk-signal"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
desk-utils = { workspace = true }
desk-agent-protocol = { workspace = true }
desk-diagnose-core = { workspace = true }
desk-signal-facade = { workspace = true }
desk-server-version = { workspace = true }
desk-server-user = { workspace = true }
desk-turn = { workspace = true }

actix-session = { workspace = true }
actix-web = { workspace = true }
actix-ws = { workspace = true }
utoipa = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
bytestring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }

turn = { workspace = true }

# Outbound model-provider HTTP (the central brain dials the configured provider).
awc = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
async-trait = { workspace = true }
# Custom connect-time DNS resolver for the model-provider SSRF guard.
actix-tls = { version = "3.5", default-features = false, features = ["connect"] }

[dev-dependencies]
# Exercise the WebSocket frame codec directly so the signaling endpoint's
# raised `max_frame_size` is regression-tested against the diagnose chunk size.
actix-http = { workspace = true }
tokio-util = { workspace = true }
