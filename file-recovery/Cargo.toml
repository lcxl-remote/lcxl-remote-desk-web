[package]
name = "desk-file-recovery"
description = "Device-private assistant file backups and durable cleanup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
zip = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4.3"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Security_Authorization", "Win32_System_IO", "Wdk_System_SystemInformation"] }

[dev-dependencies]
tempfile = { workspace = true }
