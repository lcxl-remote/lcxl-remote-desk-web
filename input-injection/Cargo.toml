[package]
name = "desk-input-injection"
description = "Input injection and host control engine for lcxl-remote-desk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
desk-utils = { workspace = true }
desk-signal-facade = { workspace = true }

log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
utoipa = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }
windows-result = { workspace = true }
windows-core = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { workspace = true }
zbus = { workspace = true }
rand = { workspace = true }
desk-capture-engine = { workspace = true }
x11rb = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.23", features = ["highsierra"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3.6"

[target.'cfg(target_os = "linux")'.dependencies.arboard]
version = "3.6"
features = ["wayland-data-control"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
