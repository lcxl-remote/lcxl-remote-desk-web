[package]
name = "desk-input-injection"
description = "Input injection and host control engine for lcxl-remote-desk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
desk-utils = { workspace = true }
desk-signal-facade = { workspace = true }

log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
utoipa = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
] }
windows-result = "0.3"
windows-core = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13", features = ["stream-trait"] }
zbus = "5.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.23", features = ["highsierra"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3.6"

[target.'cfg(target_os = "linux")'.dependencies.arboard]
version = "3.6"
features = ["wayland-data-control"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
