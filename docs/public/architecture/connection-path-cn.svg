<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">LCXL Remote Desk 连接与媒体链路</title>
  <desc id="desc">浏览器和被控设备通过信令及 STUN 或 TURN 建立 WebRTC 直连，穿透失败时回退到 TURN 中继。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111b33"/></linearGradient>
    <linearGradient id="browserCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#101b3d"/></linearGradient>
    <linearGradient id="hostCard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#132f32"/><stop offset="1" stop-color="#102127"/></linearGradient>
    <linearGradient id="p2p" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.34"/></filter>
    <filter id="glow" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <style>
      text { font-family: Inter, "PingFang SC", "Microsoft YaHei", ui-sans-serif, sans-serif; }
      .eyebrow{fill:#7dd3fc;font-size:13px;font-weight:700;letter-spacing:2.4px}.title{fill:#f8fafc;font-size:29px;font-weight:750}.section{fill:#f8fafc;font-size:20px;font-weight:700}.label{fill:#e2e8f0;font-size:16px;font-weight:650}.muted{fill:#94a3b8;font-size:14px}.tiny{fill:#cbd5e1;font-size:13px;font-weight:600}.step{fill:#dbeafe;font-size:13px;font-weight:800;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/><circle cx="1070" cy="60" r="170" fill="#2563eb" opacity=".07"/><circle cx="104" cy="530" r="190" fill="#10b981" opacity=".05"/>
  <text x="54" y="48" class="eyebrow">连接与媒体链路</text><text x="54" y="83" class="title">能直连就直连，仅在必要时中继</text>
  <g filter="url(#shadow)"><rect x="54" y="128" width="292" height="264" rx="22" fill="url(#browserCard)" stroke="#3b82f6" stroke-opacity=".5"/></g>
  <rect x="78" y="151" width="40" height="40" rx="12" fill="#2563eb"/><rect x="87" y="160" width="22" height="16" rx="2" fill="none" stroke="#dbeafe" stroke-width="2"/><path d="M92 181h12M98 176v5" stroke="#dbeafe" stroke-width="2" stroke-linecap="round"/>
  <text x="132" y="177" class="section">浏览器客户端</text><text x="78" y="212" class="muted">控制端</text>
  <rect x="78" y="228" width="244" height="54" rx="12" fill="#0f172a" fill-opacity=".72" stroke="#334155"/><circle cx="98" cy="255" r="5" fill="#60a5fa"/><text x="114" y="261" class="label">远程控制</text>
  <rect x="78" y="294" width="244" height="72" rx="12" fill="#0f172a" fill-opacity=".72" stroke="#334155"/><text x="96" y="321" class="tiny">WebRTC 传输</text>
  <g transform="translate(96 338)"><circle cx="5" cy="5" r="5" fill="#60a5fa"/><text x="17" y="10" class="muted">视频</text><circle cx="74" cy="5" r="5" fill="#a78bfa"/><text x="86" y="10" class="muted">音频</text><circle cx="145" cy="5" r="5" fill="#34d399"/><text x="157" y="10" class="muted">数据</text></g>
  <g filter="url(#shadow)"><rect x="430" y="128" width="340" height="116" rx="20" fill="#151b33" stroke="#7c3aed" stroke-opacity=".65"/><rect x="430" y="276" width="340" height="116" rx="20" fill="#151b33" stroke="#0ea5e9" stroke-opacity=".65"/></g>
  <rect x="452" y="150" width="44" height="44" rx="13" fill="#6d28d9"/><path d="M464 165h20M464 172h14M464 179h17" stroke="#ede9fe" stroke-width="2.4" stroke-linecap="round"/><text x="510" y="174" class="section">信令服务</text><text x="510" y="199" class="muted">WebSocket · 交换 SDP / ICE</text>
  <rect x="452" y="298" width="44" height="44" rx="13" fill="#0369a1"/><circle cx="474" cy="320" r="11" fill="none" stroke="#e0f2fe" stroke-width="2"/><path d="M463 320h22M474 309c4 4 4 18 0 22M474 309c-4 4-4 18 0 22" fill="none" stroke="#e0f2fe" stroke-width="1.6"/><text x="510" y="322" class="section">STUN / TURN</text><text x="510" y="347" class="muted">NAT 穿透 · 中继兜底</text>
  <g filter="url(#shadow)"><rect x="854" y="128" width="292" height="264" rx="22" fill="url(#hostCard)" stroke="#10b981" stroke-opacity=".55"/></g>
  <rect x="878" y="151" width="40" height="40" rx="12" fill="#059669"/><rect x="887" y="160" width="22" height="17" rx="2" fill="none" stroke="#d1fae5" stroke-width="2"/><path d="M892 182h12M898 177v5" stroke="#d1fae5" stroke-width="2" stroke-linecap="round"/><text x="932" y="177" class="section">被控设备</text><text x="878" y="212" class="muted">Desk Server</text>
  <rect x="878" y="228" width="244" height="54" rx="12" fill="#0f172a" fill-opacity=".72" stroke="#334155"/><circle cx="898" cy="255" r="5" fill="#34d399"/><text x="914" y="261" class="label">画面采集与编码</text>
  <rect x="878" y="294" width="244" height="72" rx="12" fill="#0f172a" fill-opacity=".72" stroke="#334155"/><text x="896" y="321" class="tiny">数据通道处理</text><text x="896" y="347" class="muted">输入 · 文件 · 剪贴板 · 白板</text>
  <path d="M346 174H420" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="7 6" marker-start="url(#arrowViolet)" marker-end="url(#arrowViolet)"/><path d="M780 174H844" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="7 6" marker-start="url(#arrowViolet)" marker-end="url(#arrowViolet)"/><path d="M346 322H420" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="7 6" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/><path d="M780 322H844" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="7 6" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <circle cx="388" cy="148" r="16" fill="#4c1d95" stroke="#8b5cf6"/><text x="379" y="153" class="step">01</text><circle cx="812" cy="296" r="16" fill="#0c4a6e" stroke="#38bdf8"/><text x="803" y="301" class="step">02</text>
  <path d="M346 462C480 430 720 430 854 462" fill="none" stroke="#1e293b" stroke-width="15" stroke-linecap="round"/><path d="M346 462C480 430 720 430 854 462" fill="none" stroke="url(#p2p)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/><path d="M346 462l17-10-2 18z" fill="#60a5fa"/><path d="M854 462l-17-10 2 18z" fill="#34d399"/>
  <rect x="456" y="420" width="288" height="66" rx="18" fill="#0f172a" stroke="#475569"/><circle cx="486" cy="453" r="17" fill="#312e81" stroke="#818cf8"/><text x="477" y="458" class="step">03</text><text x="515" y="448" class="label">WebRTC 对等连接</text><text x="515" y="469" class="muted">优先 P2P · TURN 中继兜底</text>
  <text x="54" y="528" class="muted">信令服务只负责协调会话，媒体数据不经过信令服务。</text>
  <text x="1146" y="528" class="muted" text-anchor="end">终端：独立鉴权 WebSocket。</text>
</svg>
