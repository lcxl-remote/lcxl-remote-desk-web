[package]
name = "desk-signal-facade"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# `StartupMode` doubles as a command-line value for the desk server, which is the
# only crate that parses one. Everything else — the manager included — reads the
# enum off the wire and must not pull clap in for it.
clap = ["dep:clap"]

[dependencies]
desk-agent-protocol = { workspace = true }
desk-diagnose-core = { workspace = true }
desk-utils = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true, optional = true }

actix-web = { workspace = true }
actix-ws = { workspace = true }
utoipa = { workspace = true }
utoipa_repr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_repr = { workspace = true }
wincode = { workspace = true }
chrono = { workspace = true }
webrtc = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
bytestring = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
log = { workspace = true }
futures = { workspace = true }
kuchikiki = "=0.8.8-speedreader"

[dev-dependencies]
http = "1"
serde_urlencoded = { workspace = true }
toml = { workspace = true }
