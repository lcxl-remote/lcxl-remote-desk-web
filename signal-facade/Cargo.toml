[package]
name = "desk-signal-facade"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = ["dep:rcgen", "actix-web/rustls-0_23"]
mcp-client = ["dep:rmcp", "dep:reqwest-mcp", "dep:rustls", "dep:rustls-native-certs", "dep:sse-stream"]
# `StartupMode` doubles as a command-line value for the desk server, which is the
# only crate that parses one. Everything else — the manager included — reads the
# enum off the wire and must not pull clap in for it.
clap = ["dep:clap"]

[dependencies]
serde_urlencoded = { workspace = true }
desk-agent-protocol = { workspace = true }
desk-diagnose-core = { workspace = true }
desk-utils = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true, optional = true }

actix-web = { workspace = true }
actix-ws = { workspace = true }
utoipa = { workspace = true }
utoipa_repr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_repr = { workspace = true }
wincode = { workspace = true }
chrono = { workspace = true }
webrtc = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
bytestring = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true, optional = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
reqwest-mcp = { package = "reqwest", version = "=0.13.2", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
sse-stream = { version = "0.2", optional = true }
rcgen = { version = "0.13.2", optional = true }
sha2 = { workspace = true }
url = { workspace = true }
log = { workspace = true }
futures = { workspace = true }
kuchikiki = "=0.8.8-speedreader"

[dev-dependencies]
actix-web = { workspace = true, features = ["rustls-0_23"] }
desk-diagnose-core = { workspace = true, features = ["test-support"] }
http = "1"
rcgen = "0.13.2"
tokio = { workspace = true, features = ["test-util"] }
toml = { workspace = true }
