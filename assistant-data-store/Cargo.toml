[package]
name = "desk-assistant-data-store"
description = "Shared personal-assistant entities, immutable snapshots and storage rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
schema-sync = ["sea-orm/schema-sync"]

[dependencies]
async-trait = { workspace = true }
desk-agent-protocol = { workspace = true }
desk-diagnose-core = { workspace = true }
# Hosts select their SQL driver and runtime; this crate does not select either.
sea-orm = { version = "2.0.0-rc", default-features = false, features = ["macros", "with-chrono"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
sea-orm = { version = "2.0.0-rc", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "schema-sync"] }
tokio = { workspace = true }
tempfile = { workspace = true }
