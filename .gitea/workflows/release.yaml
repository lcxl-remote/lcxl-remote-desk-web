name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vite-project/package-lock.json
      - name: Build Frontend
        working-directory: vite-project
        run: |
          npm install
          npm run build
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: vite-project/dist

  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            bin_name: lcxl-remote-desk-server
            target: x86_64-unknown-linux-gnu
          - platform: windows
            os: windows-latest
            bin_name: lcxl-remote-desk-server.exe
            target: x86_64-pc-windows-msvc
          - platform: macos
            os: macos-latest
            bin_name: lcxl-remote-desk-server
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: server/static

      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpipewire-0.3-dev pkg-config libclang-dev libasound2-dev libssl-dev libvpx-dev cmake libx11-dev libxcb1-dev libxcb-randr0-dev libxext-dev

      - name: Install macOS Dependencies
        if: matrix.platform == 'macos'
        run: brew install libvpx pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Server
        run: cargo build --release --bin lcxl-remote-desk-server --target ${{ matrix.target }}

      # Prepare Package
      - name: Create Package (Unix)
        if: matrix.platform != 'windows'
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} release/
          cp -r conf release/
          cp -r server/static release/static
          tar -czf ${{ matrix.platform }}-server.tar.gz -C release .

      - name: Create Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.bin_name }}" -Destination release\
          Copy-Item -Recurse "conf" -Destination release\
          Copy-Item -Recurse "server\static" -Destination release\static
          Compress-Archive -Path release\* -DestinationPath windows-server.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-binary
          path: |
            *.tar.gz
            *.zip

  # Optional: Build Tauri App if needed in the same workflow
  tauri:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libvpx-dev libpipewire-0.3-dev

      - name: Install libvpx (macOS)
        if: matrix.platform == 'macos'
        run: brew install libvpx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vite-project/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri App
        working-directory: tauri-app
        run: |
          npm install
          npm run tauri build

      - name: Upload Tauri Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}
          path: |
            tauri-app/src-tauri/target/release/bundle/*/*

  release:
    needs: [build, tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
