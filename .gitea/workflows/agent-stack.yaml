name: Agent Stack Limits

on: [push, pull_request, workflow_dispatch]

jobs:
  stack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Verify report parser and negative controls
        run: python -m unittest discover -s scripts/agent-stack -p test_report.py
      # Only the selected logic/signal crates get LLVM remarks. No capture,
      # encoder, Tauri or whole-dependency-tree remark build is needed here.
      - name: Enforce shared debug frames
        run: python scripts/agent-stack/run.py --package desk-diagnose-core --output target/agent-stack/core-debug.json
      - name: Enforce shared assistant storage debug frames
        run: python scripts/agent-stack/run.py --package desk-assistant-data-store --output target/agent-stack/assistant-store-debug.json
      - name: Enforce shared message page debug stack frames
        run: python scripts/agent-stack/run.py --package desk-signal-facade --output target/agent-stack/assistant-pages-debug.json
      - name: Enforce OSS debug frames
        run: python scripts/agent-stack/run.py --package desk-signal --output target/agent-stack/signal-debug.json
      - name: Verify selected device tool registration and desktop routing
        run: |
          cargo test --locked -p desk-diagnose-core --lib --features stack-budget request_devices::tests::
          cargo test --locked -p desk-signal --lib --features desk-diagnose-core/stack-budget personal_selected_desktop_read_and_whole_screen_resume_on_signal
          cargo test --locked -p desk-signal --lib --features desk-diagnose-core/stack-budget personal_selected_live_document_resumes_on_signal
          cargo test --locked -p desk-signal --lib --features desk-diagnose-core/stack-budget selectable_browser_
          cargo test --locked -p desk-signal --lib --features desk-diagnose-core/stack-budget fixed_browser_uses_the_same_signal_device_action_route
          cargo test --locked -p desk-signal --lib --features desk-diagnose-core/stack-budget selectable_artifact_
          cargo test --locked -p desk-signal --lib --features desk-diagnose-core/stack-budget selectable_ui_scope_
          cargo test --locked -p desk-signal --lib --features desk-diagnose-core/stack-budget selectable_background_
          cargo test --locked -p desk-signal --lib --features desk-diagnose-core/stack-budget selectable_goal_retains_its_device_across_signal_segments
      - name: Shared behavior and unboxed phase layout
        run: |
          cargo test --locked -p desk-diagnose-core -p desk-assistant-data-store -p desk-signal --lib --features desk-diagnose-core/stack-budget -- --skip assistant_data_store::tests::retrieval_native::memory_mutation:: --skip ai_assistant_orchestrator::tests::desktop_permission:: --skip ai_assistant_orchestrator::tests::permission_object::
          cargo test --locked -p desk-signal --lib --features desk-diagnose-core/stack-budget ai_assistant_orchestrator::tests::desktop_permission:: -- --test-threads=1
          cargo test --locked -p desk-signal --lib --features desk-diagnose-core/stack-budget ai_assistant_orchestrator::tests::permission_object:: -- --test-threads=1
          cargo test --locked -p desk-signal --lib --features desk-diagnose-core/stack-budget assistant_data_store::tests::retrieval_native::memory_mutation:: -- --test-threads=1
      - name: Enforce shared release frames
        run: python scripts/agent-stack/run.py --package desk-diagnose-core --profile release --output target/agent-stack/core-release.json
      - name: Enforce shared assistant storage release frames
        run: python scripts/agent-stack/run.py --package desk-assistant-data-store --profile release --output target/agent-stack/assistant-store-release.json
      - name: Enforce shared message page release stack frames
        run: python scripts/agent-stack/run.py --package desk-signal-facade --profile release --output target/agent-stack/assistant-pages-release.json
      - name: Enforce OSS release frames
        run: python scripts/agent-stack/run.py --package desk-signal --profile release --output target/agent-stack/signal-release.json
      - name: Release history and automatic-review combinations
        run: cargo test --locked -p desk-signal --lib --release command_history -- --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-stack-${{ matrix.os }}
          path: target/agent-stack/*.json
