name: Windows Agent

on: [push, pull_request]

jobs:
  agent:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Shared agent contracts and file batch processing
        run: cargo test --locked -p desk-agent-protocol -p desk-ipc-protocol -p desk-diagnose-core -p desk-office-batch
      - name: Windows private file recovery storage
        run: cargo test --locked -p desk-file-recovery
      # Desktop-dependent cases require a separate interactive acceptance session.
      # Compilation covers the Windows worker and isolated Office helper without
      # activating Office, connecting accounts or sending external messages.
      - name: Compile Windows server and test targets
        run: cargo test --locked -p lcxbox-agent-desk-server --no-run
      - name: Windows Office source and prepared-copy contracts
        run: |
          cargo test --locked -p lcxbox-agent-desk-server --lib worker::agent::computer_use_writer::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p lcxbox-agent-desk-server --lib worker::agent::file_reference_store::publication::tests::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p lcxbox-agent-desk-server --lib worker::agent::file_reference_store::windows_batch::tests::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p lcxbox-agent-desk-server --lib worker::agent::windows_excel_batch::tests::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p lcxbox-agent-desk-server --lib worker::agent::windows_word_batch::tests::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p lcxbox-agent-desk-server --lib service::file_manager::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The ServiceDaemon runs only resident workers: session scheduling,
      # start back-off, secret trimming, desktop routing, offers both desktop
      # workers can continue, the virtual display owner and the SYSTEM quota
      # ledger. Switching on a real secure desktop is an on-device acceptance.
      - name: Windows ServiceDaemon resident workers
        run: |
          cargo test --locked -p lcxbox-agent-desk-server --lib daemon::worker_manager::windows_reconcile_tests::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p lcxbox-agent-desk-server --lib daemon::worker_manager::desktop_routing_tests::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p lcxbox-agent-desk-server --lib daemon::worker_manager::exec_sandbox_labels::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p lcxbox-agent-desk-server --lib daemon::session_monitor::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p lcxbox-agent-desk-server --lib daemon::tests::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p lcxbox-agent-desk-server --lib worker::desktop_monitor::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p lcxbox-agent-desk-server --lib file_recovery_service::ledger_tests::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
