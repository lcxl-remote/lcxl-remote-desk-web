[package]
name = "desk-capture-engine"
description = "Screen/audio capture and encoding engine for lcxl-remote-desk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
desk-utils = { workspace = true }
desk-signal-facade = { workspace = true }

log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
utoipa = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }

yuv = { workspace = true }
x264 = { workspace = true }
openh264 = { workspace = true }
openh264-sys2 = { workspace = true }

opusic-c = { workspace = true }

cpal = { workspace = true }
ringbuf = { workspace = true }

vpx-encode = { workspace = true }

png = { workspace = true }
image = { workspace = true }
prometheus = { workspace = true }

# vpx-encode bundles pregenerated FFI bindings only up to libvpx 1.15.2 and, on
# Windows, downloads a fixed 1.13 prebuilt. On Linux/macOS the system libvpx may
# be newer (e.g. Homebrew 1.16), so generate the bindings with bindgen instead
# of depending on a matching pregenerated file.
[target.'cfg(not(target_os = "windows"))'.dependencies]
vpx-encode = { workspace = true, features = ["ffi-generate"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }
windows-result = { workspace = true }
windows-core = { workspace = true }
windows-numerics = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { workspace = true }
libc = { workspace = true }
alsa = { workspace = true }
pipewire = { workspace = true }
xcb = { workspace = true }
zbus = { workspace = true }
rand = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
core-graphics = { workspace = true }
core-audio-types = { workspace = true }

# SVT-AV1 ships only prebuilt binaries (no source build is enabled), covering a
# fixed target matrix: Linux x86_64/aarch64, macOS arm64, Windows x86_64. On any
# other target (notably macOS x86_64) the crate's build script panics, so the
# dependency — and the AV1 encoder built on it — is gated to that matrix. The
# `av1_supported` cfg emitted by build.rs mirrors this expression for the code.
[target.'cfg(any(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")), all(target_os = "macos", target_arch = "aarch64"), all(target_os = "windows", target_arch = "x86_64")))'.dependencies]
shiguredo_svt_av1 = { workspace = true }

[dev-dependencies]
hound = { workspace = true }
tempfile = { workspace = true }
rtp = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)', 'cfg(av1_supported)'] }
