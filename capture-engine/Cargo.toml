[package]
name = "desk-capture-engine"
description = "Screen/audio capture and encoding engine for lcxl-remote-desk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
desk-utils = { workspace = true }
desk-signal-facade = { workspace = true }

log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
utoipa = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }

yuv = { workspace = true }
x264 = { workspace = true }
openh264 = { workspace = true }
rav1e =  { workspace = true }

opusic-c = { workspace = true }

cpal = { workspace = true }
ringbuf = { workspace = true }

vpx-encode = { workspace = true }

png = { workspace = true }
image = { workspace = true }
prometheus = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }
windows-result = { workspace = true }
windows-core = { workspace = true }
windows-numerics = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { workspace = true }
libc = { workspace = true }
alsa = { workspace = true }
pipewire = { workspace = true }
xcb = { workspace = true }
zbus = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { workspace = true }
screencapturekit-sys = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
core-graphics = { workspace = true }
core-audio-types = { workspace = true }

[dev-dependencies]
hound = { workspace = true }
tempfile = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
