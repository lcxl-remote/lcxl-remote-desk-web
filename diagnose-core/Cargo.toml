[package]
name = "desk-diagnose-core"
description = "Model-agnostic diagnose logic (capability selection, prompt assembly, response parsing, evidence chunking) shared by the edge and the central orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
desk-agent-protocol = { workspace = true }
desk-utils = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
async-trait = { workspace = true }
# Shared secret-redaction pattern set (security model §9); pure logic, no platform dep.
regex = { workspace = true }

[dev-dependencies]
# Drives the async-seam unit tests (current-thread runtime; the seams are `?Send`).
tokio = { workspace = true, features = ["macros", "rt"] }
