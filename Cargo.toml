[package]
name = "lcxl-web-remote-desk"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.6.6"
actix-server = "2.6"
actix-web = "4.11"
tokio = { version = "1.45", features = ["full"] }
utoipa = { version = "5", features = ["actix_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
utoipa-actix-web = "0.1"
utoipa-redoc = { version = "6", features = ["actix-web"] }
utoipa-rapidoc = { version = "6", features = ["actix-web"] }
utoipa-scalar = { version = "0.3", features = ["actix-web"] }
actix-ws = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = { version = "0.22", features = ["serde"] }
toml = "0.8"
config = { version = "0.15", features = ["toml"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.34", features = ["chrono", "bundled"] }
chrono = { version = "0.4", features = ["serde"] }
r2d2_sqlite = "0.27"
r2d2 = "0.8"
env_logger = "0.11"
log = "0.4"
actix-session = { version = "0.10", features = ["cookie-session"] }
uuid = "1.16"
actix-http = "3.11.0"
actix-service = "2.0"
turn-server = { version = "3.4", features = ["udp", "tcp", "api"] }
anyhow = "1.0"
mime = "0.3"
futures-util = "0.3"
bytestring = "1.4"
webrtc = "0.13"
image = "0.25"
bytes = "1.10"


[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Shell",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
] }
windows-result = "0.3"
windows-core = "0.61"
