[workspace]
members = [
    "signal-facade",
    "server",
    "turn",
    "utils",
    "server-version",
    "signal",
    "server-user",
]
exclude = ["web", "third-deps"]
resolver = "3"

[workspace.package]
description = "Lcxl Remote Desk Web Server"
version = "0.1.0"
edition = "2024"
# need file lock feature 1.89.0
# see https://doc.rust-lang.org/stable/std/fs/struct.File.html#method.try_lock
# need 1.90.0 for rust-analyzer
rust-version = "1.90"


[workspace.dependencies]
desk-utils = { path = "utils" }
desk-turn = { path = "turn" }
desk-signal-facade = { path = "signal-facade" }
desk-server-version = { path = "server-version" }
desk-signal = { path = "signal" }
desk-server-user = { path = "server-user" }

log = "0.4"
env_logger = "0.11"
utoipa = { version = "5", features = ["actix_extras", "chrono"] }
utoipa_repr = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
turn-server = { version = "3.4", features = [
    "udp",
    "tcp",
    "api",
    "prometheus",
] }
futures = "0.3"
futures-util = "0.3"
anyhow = "1.0"
tokio = { version = "1.47", features = ["full", "tracing"] }
actix-web = "4.11"
actix-ws = "0.3"
actix-session = { version = "0.10", features = ["cookie-session"] }
webrtc = "0.13"
strum = "0.27"
strum_macros = "0.27"
bytes = "1.10"
bytestring = "1.4"
uuid = "1.17"
portable-pty = "0.8"
