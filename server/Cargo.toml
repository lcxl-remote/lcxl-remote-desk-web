[package]
name = "lcxl-remote-desk-server"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]

desk-utils = { workspace = true }
desk-turn = { workspace = true }
desk-signal-facade = { workspace = true }
desk-signal = { workspace = true }
desk-server-version = { workspace = true }
desk-server-user = { workspace = true }

actix-web = { workspace = true }
actix-ws = { workspace = true }
actix-session = { workspace = true }
actix-files = { workspace = true }
actix-server = { workspace = true }
actix-http = { workspace = true }
actix-service = { workspace = true }
awc = { workspace = true }

rustls = { workspace = true }
rustls-native-certs = { workspace = true }

env_logger = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }

utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
utoipa-actix-web = { workspace = true }
utoipa-redoc = { workspace = true }
utoipa-rapidoc = { workspace = true }
utoipa-scalar = { workspace = true }

chrono = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }

futures = { workspace = true }
futures-util = { workspace = true }
anyhow = { workspace = true }
turn-server = { workspace = true }

webrtc = { workspace = true }
webrtc-ice = { workspace = true }
webrtc-media = { workspace = true }
rtp = { workspace = true }

strum = { workspace = true }
strum_macros = { workspace = true }
bytes = { workspace = true }
bytestring = { workspace = true }
uuid = { workspace = true }
portable-pty = { workspace = true }

url = { workspace = true }

toml = "0.9"
config = { version = "0.15", features = ["toml"] }
clap = { version = "4.5", features = ["derive"] }


mime = "0.3"
yuv = "0.8"
openh264 = "0.9.3"

opusic-c = "1.5"

codepage = "0.1"
encoding_rs = "0.8"
regex = "1.11"
# turn-server dependencies prometheus 0.13.4, if use 0.14, promethueus global variable will not be shared between app with turn-server lib
prometheus = "0.13.4"

vpx-encode = { path = "../third-deps/vpx-encode", features = ["vp9"] }
rust-i18n = "3.1"
webbrowser = "1"
sysinfo = "0.37"
opentelemetry = { version = "0.31.0", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.31.0", features = [
    "metrics",
    "trace",
    "grpc-tonic",
] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
tracing-opentelemetry = "0.32.1"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
trash = "5.2.5"


[target."cfg(tokio_unstable)".dependencies]
console-subscriber = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Animation",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Globalization",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Hlsl",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_Performance",
] }
windows-result = "0.3"
windows-core = "0.61"
windows-numerics = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["all-extensions"] }
libc = "0.2"
alsa = "0.9"
# need install libpipewire-0.3-dev
pipewire = "0.8"
evdev = { version = "0.13", features = ["stream-trait"] }
xcb = { version = "1.5", features = ["randr"] }
zbus = "5.6"
rand = { workspace = true }
arboard = { version = "3.6", features = ["wayland-data-control"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "0.2"
screencapturekit-sys = "0.2"
objc2 = "0.5"
objc2-foundation = "0.2"
core-graphics = { version = "0.23", features = ["highsierra"] }
core-audio-types = "0.2"


[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = "3.6"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
which = { version = "8.0", features = ["regex"] }


[dev-dependencies]
image = "0.25"
hound = "3.5"
tempfile = "3"

[lints.rust]
# ignore tokio_unstable lint
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
