<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">LCXL Remote Desk central AI diagnostics and owner-confirmed execution</title>
  <desc id="desc">The central signaling brain orchestrates bounded model turns. A thin controlled edge collects and strictly redacts evidence locally. Suggested commands require owner confirmation, a server-sealed argv plan, and edge re-validation before execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111b33"/></linearGradient>
    <linearGradient id="central" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#312e81"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#064e3b"/><stop offset="1" stop-color="#12342f"/></linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#78350f"/><stop offset="1" stop-color="#3b2514"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".34"/></filter>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
    <marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.eyebrow{fill:#c4b5fd;font-size:13px;font-weight:700;letter-spacing:2.4px}.title{fill:#f8fafc;font-size:29px;font-weight:750}.section{fill:#f8fafc;font-size:19px;font-weight:700}.label{fill:#e2e8f0;font-size:15px;font-weight:650}.muted{fill:#94a3b8;font-size:13px}.tiny{fill:#cbd5e1;font-size:12px;font-weight:600}.tag{fill:#ddd6fe;font-size:11px;font-weight:800;letter-spacing:1.1px}.step{fill:#fff;font-size:12px;font-weight:800}.flow{fill:#cbd5e1;font-size:12px;font-weight:650}
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/><circle cx="1104" cy="78" r="200" fill="#7c3aed" opacity=".07"/><circle cx="90" cy="720" r="190" fill="#10b981" opacity=".05"/>
  <text x="54" y="48" class="eyebrow">AI DIAGNOSTICS · TRUST BOUNDARIES</text><text x="54" y="83" class="title">Central brain, thin edge, explicit owner approval.</text>

  <!-- Browser -->
  <rect x="42" y="120" width="236" height="580" rx="23" fill="#0f172a" fill-opacity=".55" stroke="#334155"/>
  <rect x="62" y="141" width="96" height="25" rx="12.5" fill="#172554"/><circle cx="79" cy="153.5" r="5" fill="#60a5fa"/><text x="92" y="158" class="tag">BROWSER</text>
  <g filter="url(#shadow)"><rect x="66" y="194" width="188" height="102" rx="18" fill="#172554" stroke="#3b82f6" stroke-opacity=".62"/><rect x="66" y="346" width="188" height="106" rx="18" fill="#152238" stroke="#38bdf8" stroke-opacity=".5"/><rect x="66" y="520" width="188" height="120" rx="18" fill="url(#warn)" stroke="#f59e0b" stroke-opacity=".68"/></g>
  <circle cx="96" cy="225" r="17" fill="#2563eb"/><path d="M89 223c0-5 3-8 7-8s7 3 7 8-3 7-7 7h-3l-5 4 2-7c-1-1-1-2-1-4z" fill="none" stroke="#dbeafe" stroke-width="1.8" stroke-linejoin="round"/><text x="122" y="230" class="section">Question</text><text x="88" y="264" class="muted">Plain-language troubleshooting</text><text x="88" y="282" class="muted">from an authenticated user</text>
  <circle cx="96" cy="377" r="17" fill="#0369a1"/><path d="M88 377l5 5 11-12" fill="none" stroke="#e0f2fe" stroke-width="2.2" stroke-linecap="round"/><text x="122" y="382" class="section">Diagnosis</text><text x="88" y="416" class="muted">Findings · evidence summary</text><text x="88" y="434" class="muted">suggested remediation</text>
  <circle cx="96" cy="551" r="17" fill="#b45309"/><path d="M96 541v12M96 559h.1" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round"/><text x="122" y="556" class="section">Owner gate</text><text x="88" y="588" class="muted">Inspect the exact command</text><text x="88" y="607" class="muted">confirm one at a time</text><text x="88" y="626" class="muted">decline / timeout = stop</text>

  <!-- Central signaling brain -->
  <rect x="315" y="120" width="520" height="580" rx="23" fill="#111827" fill-opacity=".72" stroke="#6366f1" stroke-opacity=".55" stroke-width="1.5"/>
  <rect x="337" y="141" width="214" height="25" rx="12.5" fill="#312e81"/><circle cx="355" cy="153.5" r="5" fill="#a78bfa"/><text x="368" y="158" class="tag">CENTRAL SIGNALING BRAIN</text><text x="809" y="158" class="muted" text-anchor="end">model gateway · policy · audit</text>
  <g filter="url(#shadow)"><rect x="345" y="190" width="460" height="122" rx="18" fill="url(#central)" stroke="#818cf8" stroke-opacity=".72"/></g>
  <circle cx="378" cy="224" r="18" fill="#4f46e5"/><path d="M370 224h16M378 216v16M372 218l12 12M384 218l-12 12" stroke="#e0e7ff" stroke-width="1.7" stroke-linecap="round"/><text x="410" y="220" class="section">Bounded agent orchestrator</text><text x="410" y="243" class="muted">Owns the conversation and selects read capabilities</text>
  <rect x="367" y="265" width="118" height="26" rx="9" fill="#171d3d"/><text x="426" y="282" class="tiny" text-anchor="middle">tool selection</text><rect x="494" y="265" width="132" height="26" rx="9" fill="#171d3d"/><text x="560" y="282" class="tiny" text-anchor="middle">step limits</text><rect x="635" y="265" width="148" height="26" rx="9" fill="#171d3d"/><text x="709" y="282" class="tiny" text-anchor="middle">streamed response</text>

  <path d="M366 365H784" stroke="#334155" stroke-width="1"/><circle cx="385" cy="365" r="6" fill="#60a5fa"/><text x="402" y="370" class="label">Evidence requests are capability-scoped; raw collection stays on the edge.</text>

  <rect x="345" y="454" width="460" height="156" rx="18" fill="#0f172a" stroke="#475569"/><text x="367" y="481" class="tag">EXECUTION AUTHORITY · ONLY AFTER CONFIRMATION</text>
  <rect x="367" y="500" width="188" height="84" rx="14" fill="url(#warn)" stroke="#f59e0b" stroke-opacity=".65"/><circle cx="389" cy="523" r="13" fill="#b45309"/><text x="385" y="527" class="step">1</text><text x="412" y="528" class="label">Classify + authorize</text><text x="385" y="554" class="muted">blocklist · risk · owner decision</text><text x="385" y="573" class="muted">no approval, no execution</text>
  <path d="M563 542H583" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)"/>
  <rect x="591" y="500" width="192" height="84" rx="14" fill="#27204d" stroke="#8b5cf6" stroke-opacity=".65"/><circle cx="613" cy="523" r="13" fill="#6d28d9"/><text x="609" y="527" class="step">2</text><text x="636" y="528" class="label">Seal argv plan</text><text x="609" y="554" class="muted">immutable fields</text><text x="609" y="573" class="muted">never re-parse a string</text>
  <rect x="345" y="635" width="460" height="40" rx="12" fill="#171d2d"/><circle cx="365" cy="655" r="5" fill="#94a3b8"/><text x="380" y="660" class="tiny">Audit stores metadata and summaries — never raw prompts, output, or screenshots</text>

  <!-- Model and thin edge -->
  <g filter="url(#shadow)"><rect x="900" y="170" width="250" height="154" rx="20" fill="#271948" stroke="#a78bfa" stroke-opacity=".65"/><rect x="880" y="382" width="280" height="274" rx="20" fill="url(#edge)" stroke="#34d399" stroke-opacity=".68"/></g>
  <rect x="924" y="194" width="44" height="44" rx="13" fill="#7c3aed"/><path d="M946 203v26M933 216h26M937 207l18 18M955 207l-18 18" stroke="#ede9fe" stroke-width="1.8" stroke-linecap="round"/><text x="982" y="218" class="section">AI model</text><text x="924" y="260" class="muted">OpenAI-compatible / Anthropic</text><text x="924" y="280" class="muted">receives centrally assembled,</text><text x="924" y="298" class="muted">redacted context only</text>

  <rect x="902" y="401" width="174" height="25" rx="12.5" fill="#164e3b"/><circle cx="920" cy="413.5" r="5" fill="#34d399"/><text x="933" y="418" class="tag" fill="#a7f3d0">THIN CONTROLLED EDGE</text>
  <rect x="902" y="443" width="236" height="58" rx="13" fill="#0f2e2a" stroke="#10b981" stroke-opacity=".55"/><circle cx="923" cy="472" r="13" fill="#047857"/><text x="919" y="476" class="step">1</text><text x="946" y="468" class="label">Read-only collection</text><text x="946" y="487" class="muted">system · process · ports · logs</text>
  <rect x="902" y="514" width="236" height="52" rx="13" fill="#12342f" stroke="#34d399" stroke-opacity=".6"/><circle cx="923" cy="540" r="13" fill="#059669"/><text x="919" y="544" class="step">2</text><text x="946" y="536" class="label">Strict local redaction</text><text x="946" y="555" class="muted">any failure blocks the request</text>
  <rect x="902" y="580" width="236" height="54" rx="13" fill="#2f291b" stroke="#fbbf24" stroke-opacity=".65"/><circle cx="923" cy="607" r="13" fill="#b45309"/><text x="919" y="611" class="step">3</text><text x="946" y="603" class="label">Re-validate + execute</text><text x="946" y="622" class="muted">risk ceiling · exact plan fields</text>

  <!-- Flows -->
  <path d="M254 244H335" stroke="#60a5fa" stroke-width="3" marker-end="url(#blue)"/><text x="294" y="233" class="flow" text-anchor="middle">ask</text>
  <path d="M805 225H890" stroke="#a78bfa" stroke-width="2.7" marker-end="url(#violet)"/><path d="M900 274H815" stroke="#a78bfa" stroke-width="2.7" marker-end="url(#violet)"/><text x="853" y="211" class="flow" text-anchor="middle">model turns</text>
  <path d="M805 292C855 320 842 442 892 468" fill="none" stroke="#60a5fa" stroke-width="2.8" marker-end="url(#blue)"/><text x="851" y="381" class="flow" text-anchor="middle">collect request</text>
  <path d="M892 542C850 530 852 333 805 307" fill="none" stroke="#34d399" stroke-width="2.8" marker-end="url(#green)"/><text x="863" y="513" class="flow" text-anchor="end">redacted evidence</text>
  <path d="M345 397H264" stroke="#a78bfa" stroke-width="2.8" marker-end="url(#violet)"/><text x="304" y="386" class="flow" text-anchor="middle">diagnose</text>
  <path d="M900 304C858 342 844 472 795 512" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#amber)"/><text x="849" y="439" class="flow" text-anchor="middle">proposed command</text>
  <path d="M254 579H357" stroke="#fbbf24" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#amber)"/><text x="305" y="567" class="flow" text-anchor="middle">owner decision</text>
  <path d="M805 567H892" stroke="#fbbf24" stroke-width="3" marker-end="url(#amber)"/><text x="849" y="556" class="flow" text-anchor="middle">sealed plan</text>
  <path d="M880 636C830 699 490 711 420 685" fill="none" stroke="#34d399" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#green)"/><text x="667" y="704" class="flow" text-anchor="middle">execution result backfill</text>
</svg>
