<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">LCXL Remote Desk service-daemon process model</title>
  <desc id="desc">The privileged ServiceDaemon owns signaling and WebRTC while a SessionWorker in the user desktop session handles capture, encoding, and input.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111b33"/></linearGradient>
    <linearGradient id="daemon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#312e81"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="worker" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#064e3b"/><stop offset="1" stop-color="#12342f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".34"/></filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.eyebrow{fill:#a5b4fc;font-size:13px;font-weight:700;letter-spacing:2.4px}.title{fill:#f8fafc;font-size:29px;font-weight:750}.section{fill:#f8fafc;font-size:20px;font-weight:700}.label{fill:#e2e8f0;font-size:16px;font-weight:650}.muted{fill:#94a3b8;font-size:14px}.tiny{fill:#cbd5e1;font-size:13px;font-weight:600}.tag{fill:#c7d2fe;font-size:12px;font-weight:800;letter-spacing:1.2px}
    </style>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/><circle cx="1100" cy="76" r="190" fill="#4f46e5" opacity=".07"/><circle cx="92" cy="594" r="170" fill="#0ea5e9" opacity=".05"/>
  <text x="54" y="48" class="eyebrow">PROCESS MODEL · SERVICE-DAEMON</text><text x="54" y="83" class="title">Keep the connection privileged. Keep desktop work in-session.</text>

  <!-- External actors -->
  <g filter="url(#shadow)"><rect x="54" y="174" width="244" height="116" rx="20" fill="#172554" stroke="#3b82f6" stroke-opacity=".55"/><rect x="54" y="382" width="244" height="116" rx="20" fill="#151b33" stroke="#7c3aed" stroke-opacity=".6"/></g>
  <rect x="78" y="198" width="42" height="42" rx="12" fill="#2563eb"/><rect x="87" y="207" width="24" height="17" rx="2" fill="none" stroke="#dbeafe" stroke-width="2"/><path d="M92 229h14M99 224v5" stroke="#dbeafe" stroke-width="2" stroke-linecap="round"/><text x="134" y="220" class="section">Browser</text><text x="78" y="262" class="muted">Remote control client</text>
  <rect x="78" y="406" width="42" height="42" rx="12" fill="#6d28d9"/><path d="M90 419h18M90 426h13M90 433h16" stroke="#ede9fe" stroke-width="2.3" stroke-linecap="round"/><text x="134" y="428" class="section">Signaling</text><text x="78" y="470" class="muted">Session coordination</text>

  <!-- Host and privilege boundary -->
  <rect x="358" y="120" width="788" height="470" rx="25" fill="#111827" fill-opacity=".72" stroke="#475569" stroke-width="1.5"/>
  <rect x="382" y="142" width="148" height="27" rx="13.5" fill="#1e293b"/><circle cx="401" cy="155.5" r="5" fill="#fbbf24"/><text x="415" y="160" class="tag">CONTROLLED HOST</text>
  <text x="1096" y="160" class="muted" text-anchor="end">service-daemon mode</text>

  <!-- ServiceDaemon -->
  <g filter="url(#shadow)"><rect x="406" y="190" width="692" height="146" rx="20" fill="url(#daemon)" stroke="#818cf8" stroke-opacity=".75"/></g>
  <rect x="430" y="214" width="48" height="48" rx="14" fill="#4f46e5"/><path d="M454 223l13 6v10c0 9-6 15-13 18-7-3-13-9-13-18v-10z" fill="none" stroke="#e0e7ff" stroke-width="2.2"/><path d="M448 239l4 4 8-9" fill="none" stroke="#e0e7ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="494" y="237" class="section">ServiceDaemon</text><text x="494" y="262" class="muted">SYSTEM / root · long-lived process</text>
  <rect x="430" y="282" width="194" height="34" rx="10" fill="#0f172a" fill-opacity=".66"/><circle cx="447" cy="299" r="4" fill="#a78bfa"/><text x="459" y="304" class="tiny">SignalingProxy</text>
  <rect x="636" y="282" width="222" height="34" rx="10" fill="#0f172a" fill-opacity=".66"/><circle cx="653" cy="299" r="4" fill="#60a5fa"/><text x="665" y="304" class="tiny">WebRTC PeerConnection</text>
  <rect x="870" y="282" width="204" height="34" rx="10" fill="#0f172a" fill-opacity=".66"/><circle cx="887" cy="299" r="4" fill="#fbbf24"/><text x="899" y="304" class="tiny">Worker lifecycle</text>

  <!-- Session boundary and worker -->
  <rect x="406" y="374" width="692" height="178" rx="20" fill="#0f172a" fill-opacity=".48" stroke="#475569" stroke-dasharray="7 6"/>
  <rect x="430" y="414" width="174" height="25" rx="12.5" fill="#164e3b"/><circle cx="449" cy="426.5" r="5" fill="#34d399"/><text x="463" y="431" class="tag" fill="#a7f3d0">USER DESKTOP SESSION</text>
  <g filter="url(#shadow)"><rect x="454" y="450" width="596" height="76" rx="18" fill="url(#worker)" stroke="#34d399" stroke-opacity=".7"/></g>
  <rect x="474" y="467" width="42" height="42" rx="12" fill="#059669"/><path d="M484 478h22v16h-22zM489 499h12M495 494v5" fill="none" stroke="#d1fae5" stroke-width="2" stroke-linecap="round"/>
  <text x="530" y="488" class="section">SessionWorker</text><text x="530" y="511" class="muted">capture + encode · input injection · files / clipboard</text>

  <!-- External paths -->
  <path d="M298 232H396" fill="none" stroke="#60a5fa" stroke-width="4" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/><rect x="316" y="199" width="68" height="24" rx="12" fill="#0c4a6e"/><text x="350" y="216" class="tag" text-anchor="middle" fill="#bae6fd">WEBRTC</text>
  <path d="M298 440C338 440 342 300 396 300" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="7 6" marker-start="url(#arrowViolet)" marker-end="url(#arrowViolet)"/><text x="320" y="392" class="muted">signaling</text>

  <!-- IPC paths -->
  <path d="M610 336V428" fill="none" stroke="#60a5fa" stroke-width="3" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/><rect x="515" y="354" width="190" height="54" rx="14" fill="#0c4a6e"/><text x="610" y="377" class="tiny" text-anchor="middle">event pipe · bidirectional</text><text x="610" y="396" class="muted" text-anchor="middle">control · signaling</text>
  <path d="M800 428V336" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/><rect x="705" y="354" width="190" height="54" rx="14" fill="#064e3b"/><text x="800" y="377" class="tiny" text-anchor="middle">media pipe · one-way</text><text x="800" y="396" class="muted" text-anchor="middle">encoded audio / video</text>
  <path d="M990 336V428" fill="none" stroke="#fbbf24" stroke-width="3" marker-start="url(#arrowAmber)" marker-end="url(#arrowAmber)"/><rect x="895" y="354" width="190" height="54" rx="14" fill="#3b2b12"/><text x="990" y="377" class="tiny" text-anchor="middle">file pipe · bidirectional</text><text x="990" y="396" class="muted" text-anchor="middle">chunks · commands</text>

  <rect x="358" y="608" width="12" height="12" rx="3" fill="#818cf8"/><text x="380" y="619" class="muted">The PeerConnection survives worker restarts and user-session switches.</text>
</svg>
